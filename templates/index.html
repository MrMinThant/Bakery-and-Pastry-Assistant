
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery VLM Voice & Vision Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 480px;
            margin: 30px auto;
            padding: 15px;
            background: #faf7f2;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #70452d;
        }

        .card {
            background: white;
            padding: 18px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #e5ded5;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 12px;
        }

        input[type="file"] {
            width: 100%;
        }

        #preview {
            display: none;
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-top: 15px;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }

        #recordBtn {
            background: #e58a36;
        }

        #recordBtn.recording {
            background: #c0392b;
        }

        #submitBtn {
            background: #4caf50;
        }

        #submitBtn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #resultCard {
            display: none;
        }

        #result {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>🥐 Bakery & Pastry AI Assistant</h1>

    <div class="card">
        <label>1. Select or Take a Bakery Photo</label>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            capture="environment"
        >

        <img id="preview" alt="Bakery image preview">
    </div>

    <div class="card">
        <label>2. Record Your Voice Question</label>

        <button id="recordBtn">
            Start Recording
        </button>

        <p id="audioStatus">No recording yet.</p>

        <audio id="audioPlayback" controls style="display:none;"></audio>
    </div>

    <button id="submitBtn" disabled>
        Ask AI Assistant
    </button>

    <div class="card" id="resultCard">
        <h3>AI Analysis Result</h3>
        <div id="result"></div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob = null;

        const imageInput = document.getElementById("imageInput");
        const preview = document.getElementById("preview");
        const recordBtn = document.getElementById("recordBtn");
        const audioStatus = document.getElementById("audioStatus");
        const audioPlayback = document.getElementById("audioPlayback");
        const submitBtn = document.getElementById("submitBtn");
        const resultCard = document.getElementById("resultCard");
        const resultDiv = document.getElementById("result");

        function checkReady() {
            submitBtn.disabled = !(
                imageInput.files.length > 0 && audioBlob !== null
            );
        }

        // Image preview
        imageInput.addEventListener("change", function () {
            const file = imageInput.files[0];

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            }

            checkReady();
        });

        // Voice recording
        recordBtn.addEventListener("click", async function () {
            try {
                if (!mediaRecorder || mediaRecorder.state === "inactive") {

                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: true
                    });

                    let mimeType = "audio/webm";

                    if (!MediaRecorder.isTypeSupported(mimeType)) {
                        mimeType = "";
                    }

                    mediaRecorder = mimeType
                        ? new MediaRecorder(stream, { mimeType })
                        : new MediaRecorder(stream);

                    audioChunks = [];

                    mediaRecorder.ondataavailable = function (event) {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = function () {
                        audioBlob = new Blob(audioChunks, {
                            type: mediaRecorder.mimeType || "audio/webm"
                        });

                        audioPlayback.src = URL.createObjectURL(audioBlob);
                        audioPlayback.style.display = "block";

                        audioStatus.textContent = "Voice recorded successfully!";

                        stream.getTracks().forEach(track => track.stop());

                        checkReady();
                    };

                    mediaRecorder.start();

                    recordBtn.textContent = "Stop Recording";
                    recordBtn.classList.add("recording");
                    audioStatus.textContent = "Recording... Speak now.";

                } else {
                    mediaRecorder.stop();

                    recordBtn.textContent = "Record Again";
                    recordBtn.classList.remove("recording");
                }

            } catch (error) {
                alert("Microphone error: " + error.message);
            }
        });

        // Send image and audio to Flask backend
        submitBtn.addEventListener("click", async function () {
            submitBtn.disabled = true;
            submitBtn.textContent = "Analyzing...";

            resultCard.style.display = "block";
            resultDiv.textContent = "Please wait. AI is analyzing your image and voice...";

            const formData = new FormData();

            formData.append("image", imageInput.files[0]);
            formData.append("audio", audioBlob, "question.webm");

            try {
                const response = await fetch("/analyze", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Analysis failed.");
                }

                resultDiv.textContent = data.answer || "No answer received.";

            } catch (error) {
                resultDiv.textContent = "Error: " + error.message;

            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Ask AI Assistant";
                checkReady();
            }
        });
    </script>

</body>
</html>
