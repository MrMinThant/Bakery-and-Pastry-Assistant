
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bakery VLM Voice & Vision Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 480px;
            margin: 30px auto;
            padding: 15px;
            background: #faf7f2;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #70452d;
            font-size: 26px;
            margin-bottom: 25px;
        }

        h3 {
            color: #70452d;
            margin-top: 0;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 18px;
            border-radius: 12px;
            border: 1px solid #e5ded5;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 14px;
            color: #513c2e;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #faf7f2;
            border-radius: 8px;
        }

        #preview {
            display: none;
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            margin-top: 15px;
            border-radius: 8px;
            background: #f5f1eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        button:hover:not(:disabled) {
            opacity: 0.88;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #recordBtn {
            background: #e58a36;
        }

        #recordBtn.recording {
            background: #c0392b;
        }

        #submitBtn {
            background: #4caf50;
        }

        #audioStatus {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
        }

        audio {
            width: 100%;
            margin-top: 12px;
        }

        #resultCard {
            display: none;
        }

        #result {
            white-space: pre-wrap;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-top: -15px;
            margin-bottom: 25px;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <h1>🥐 Bakery & Pastry AI Assistant</h1>

    <p class="subtitle">
        Identify bakery products using your photo and voice.
    </p>

    <!-- PHOTO SECTION -->
    <div class="card">

        <label>1. Select or Take a Bakery Photo</label>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            capture="environment"
        >

        <img
            id="preview"
            alt="Bakery product preview"
        >

    </div>


    <!-- VOICE RECORDING SECTION -->
    <div class="card">

        <label>2. Record Your Voice Question</label>

        <button id="recordBtn" type="button">
            🎤 Start Recording
        </button>

        <p id="audioStatus">
            No recording yet.
        </p>

        <audio
            id="audioPlayback"
            controls
            style="display:none;"
        ></audio>

    </div>


    <!-- SUBMIT BUTTON -->
    <button id="submitBtn" type="button" disabled>
        Ask AI Assistant
    </button>


    <!-- RESULT SECTION -->
    <div class="card" id="resultCard">

        <h3>AI Analysis Result</h3>

        <div id="result"></div>

    </div>


    <p class="footer">
        Bakery VLM Voice & Vision Assistant
    </p>


    <script>

        // =====================================
        // VARIABLES
        // =====================================

        let mediaRecorder = null;
        let audioChunks = [];
        let audioBlob = null;
        let currentStream = null;

        const imageInput = document.getElementById("imageInput");
        const preview = document.getElementById("preview");

        const recordBtn = document.getElementById("recordBtn");
        const audioStatus = document.getElementById("audioStatus");
        const audioPlayback = document.getElementById("audioPlayback");

        const submitBtn = document.getElementById("submitBtn");

        const resultCard = document.getElementById("resultCard");
        const resultDiv = document.getElementById("result");


        // =====================================
        // CHECK IF BOTH INPUTS ARE READY
        // =====================================

        function checkReady() {

            submitBtn.disabled = !(
                imageInput.files.length > 0 &&
                audioBlob !== null &&
                (!mediaRecorder || mediaRecorder.state === "inactive")
            );

        }


        // =====================================
        // IMAGE PREVIEW
        // =====================================

        imageInput.addEventListener("change", function () {

            const file = imageInput.files[0];

            if (file) {

                if (preview.src.startsWith("blob:")) {
                    URL.revokeObjectURL(preview.src);
                }

                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";

            } else {

                preview.style.display = "none";

            }

            checkReady();

        });


        // =====================================
        // VOICE RECORDING
        // =====================================

        recordBtn.addEventListener("click", async function () {

            try {

                // START RECORDING

                if (!mediaRecorder || mediaRecorder.state === "inactive") {

                    if (!navigator.mediaDevices ||
                        !navigator.mediaDevices.getUserMedia) {

                        throw new Error(
                            "Microphone access requires HTTPS and a supported browser."
                        );

                    }

                    if (!window.MediaRecorder) {

                        throw new Error(
                            "Your browser does not support voice recording."
                        );

                    }

                    currentStream =
                        await navigator.mediaDevices.getUserMedia({
                            audio: true
                        });

                    let mimeType = "";

                    const supportedTypes = [
                        "audio/webm;codecs=opus",
                        "audio/webm",
                        "audio/mp4"
                    ];

                    for (const type of supportedTypes) {

                        if (MediaRecorder.isTypeSupported(type)) {
                            mimeType = type;
                            break;
                        }

                    }

                    if (mimeType) {

                        mediaRecorder = new MediaRecorder(
                            currentStream,
                            { mimeType: mimeType }
                        );

                    } else {

                        mediaRecorder = new MediaRecorder(currentStream);

                    }

                    audioChunks = [];
                    audioBlob = null;

                    submitBtn.disabled = true;

                    mediaRecorder.ondataavailable = function (event) {

                        if (event.data && event.data.size > 0) {
                            audioChunks.push(event.data);
                        }

                    };

                    mediaRecorder.onstop = function () {

                        audioBlob = new Blob(audioChunks, {
                            type: mediaRecorder.mimeType || "audio/webm"
                        });

                        audioPlayback.src =
                            URL.createObjectURL(audioBlob);

                        audioPlayback.style.display = "block";

                        audioStatus.textContent =
                            "Voice recorded successfully!";

                        recordBtn.textContent = "🎤 Record Again";

                        recordBtn.classList.remove("recording");

                        if (currentStream) {

                            currentStream.getTracks().forEach(
                                track => track.stop()
                            );

                            currentStream = null;

                        }

                        checkReady();

                    };

                    mediaRecorder.start();

                    recordBtn.textContent = "⏹ Stop Recording";

                    recordBtn.classList.add("recording");

                    audioStatus.textContent =
                        "Recording... Speak your question now.";

                }

                // STOP RECORDING

                else if (mediaRecorder.state === "recording") {

                    mediaRecorder.stop();

                    recordBtn.disabled = true;

                    audioStatus.textContent =
                        "Finishing your recording...";

                    // The onstop event will enable the button again.

                    mediaRecorder.addEventListener("stop", function () {
                        recordBtn.disabled = false;
                    }, { once: true });

                }

            } catch (error) {

                if (currentStream) {

                    currentStream.getTracks().forEach(
                        track => track.stop()
                    );

                    currentStream = null;

                }

                audioStatus.textContent = "Recording could not start.";

                alert("Microphone error: " + error.message);

            }

        });


        // =====================================
        // SEND IMAGE AND AUDIO TO FLASK BACKEND
        // =====================================

        submitBtn.addEventListener("click", async function () {

            if (!imageInput.files.length || !audioBlob) {

                alert("Please select a photo and record a voice question.");

                return;

            }

            submitBtn.disabled = true;

            submitBtn.textContent = "Analyzing...";

            resultCard.style.display = "block";

            resultDiv.textContent =
                "Please wait. AI is analyzing your image and voice...";

            const formData = new FormData();

            formData.append(
                "image",
                imageInput.files[0]
            );

            const audioExtension =
                audioBlob.type.includes("mp4") ? "mp4" : "webm";

            formData.append(
                "audio",
                audioBlob,
                "question." + audioExtension
            );


            try {

                // SEND REQUEST TO PYTHON BACKEND

                const response = await fetch("/analyze", {

                    method: "POST",

                    body: formData

                });


                // READ SERVER RESPONSE

                const responseText = await response.text();

                let data;

                try {

                    data = JSON.parse(responseText);

                } catch (error) {

                    throw new Error(
                        "Server returned an invalid response. HTTP status: " +
                        response.status +
                        ". Please check Render Logs."
                    );

                }


                // CHECK FOR SERVER ERRORS

                if (!response.ok) {

                    throw new Error(
                        data.error || "AI analysis failed."
                    );

                }


                // DISPLAY AI RESULT

                resultDiv.textContent =
                    data.answer || "No answer received.";


            } catch (error) {

                resultDiv.textContent =
                    "Error: " + error.message;

            } finally {

                submitBtn.textContent = "Ask AI Assistant";

                checkReady();

            }

        });

    </script>

</body>
</html>
